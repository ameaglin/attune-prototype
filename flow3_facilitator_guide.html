<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow 3: Facilitator Guide</title>
<link rel="stylesheet" href="shared-app.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #333; padding: 24px 16px; }
.prototype-nav { display: flex; align-items: center; gap: 20px; }
.slide-arrow { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid #d5d5d5; background: white; font-size: 22px; color: #333; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: 0.15s; }
.slide-arrow:hover:not(:disabled) { background: #f5f5f7; border-color: #999; }
.slide-arrow:disabled { opacity: 0.25; cursor: default; }
.slide-counter { position: absolute; top: 12px; right: 12px; font-size: 11px; color: #aaa; background: rgba(255,255,255,0.9); padding: 4px 8px; border-radius: 6px; z-index: 20; pointer-events: none; }
.phone-frame { width: 375px; height: 812px; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.12); background: white; position: relative; }
.screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background: white; overflow-y: auto; }
.screen.active { display: flex; }
</style>
</head>
<body>
<div class="prototype-shell">
<div class="flow-switcher">
 <a href="flow1.html" class="flow-btn">Flow 1 · Onboarding</a>
 <a href="flow2.html" class="flow-btn">Flow 2 · Returning</a>
 <a href="flow3_facilitator_guide.html" class="flow-btn active">Flow 3 · Guide</a>
</div>
<div class="prototype-nav">
<button class="slide-arrow slide-prev" onclick="navPrev()" aria-label="Previous screen">←</button>
<div class="phone-frame">
<span class="slide-counter" id="slide-counter"></span>

<!-- Session Picker -->
<div id="guide-sessions" class="screen active has-app-nav">
	<div class="guide-header">
		<h3>Facilitator Guide</h3>
		<p>Choose a session to view its Live Gathering guide.</p>
	</div>
	<div class="guide-scroll" id="session-list"></div>
</div>

<!-- Session Agenda -->
<div id="guide-agenda" class="screen has-app-nav">
	<div class="guide-detail-header">
		<button class="guide-back" onclick="goSessionList()">←</button>
		<div class="guide-detail-title" id="agenda-session-title"></div>
	</div>
	<div class="guide-scroll">
		<div class="fac-note" id="fac-note">
			<div class="fac-note-header" onclick="toggleFacNote()">
				<span class="fac-note-icon">💡</span>
				<span class="fac-note-title" id="fac-note-title-text"></span>
				<span class="fac-note-chevron">▾</span>
			</div>
			<div class="fac-note-body" id="fac-note-body"></div>
		</div>
		<button class="start-live-btn" onclick="startLiveGathering()">▶ Start Live Gathering</button>
		<div id="agenda-pieces"></div>
	</div>
</div>

<!-- Piece Detail -->
<div id="guide-detail" class="screen has-app-nav">
	<div class="guide-detail-header">
		<button class="guide-back" onclick="goGuideAgenda()">←</button>
		<div class="guide-badge" id="guide-num">1</div>
		<div class="guide-detail-title" id="guide-title"></div>
	</div>
	<p style="font-size:13px;color:#999;padding:12px 20px 0;" id="guide-subtitle"></p>
	<div class="guide-scroll" id="guide-detail-body"></div>
	<div class="guide-section-nav">
		<button class="guide-sec-btn gray" onclick="detailPrev()">← Previous</button>
		<button class="guide-sec-btn dark" onclick="detailNext()">Next →</button>
	</div>
</div>

<!-- Live Facilitator Mode -->
<div id="guide-live" class="screen">
	<div class="live-top">
		<div>
			<div class="live-session-label" id="live-session-label"></div>
			<div class="live-timer" id="live-timer">0:00 elapsed</div>
		</div>
		<button class="live-exit-btn" onclick="exitLiveGathering()">✕ Exit</button>
	</div>
	<div class="live-progress">
		<div class="live-progress-bar" id="live-progress-bar"></div>
		<div class="live-progress-labels" id="live-progress-labels"></div>
	</div>
	<div class="live-current-row">
		<div>
			<div class="live-current-name" id="live-current-name"></div>
			<div class="live-current-meta" id="live-current-meta"></div>
		</div>
		<div class="live-nav">
			<button class="live-nav-btn live-prev" onclick="livePrevSection()" aria-label="Previous section">‹</button>
			<button class="live-nav-btn live-next" onclick="liveNextSection()" aria-label="Next section">›</button>
		</div>
	</div>
	<div class="live-body" id="live-cards"></div>
</div>

<nav class="app-nav">
	<button class="app-nav-item" data-tab="today" onclick="appTab('today')"><span class="app-nav-icon">⌂</span>Today</button>
	<button class="app-nav-item" data-tab="practice" onclick="appTab('practice')"><span class="app-nav-icon">◎</span>Practice</button>
	<button class="app-nav-item" data-tab="patterns" onclick="appTab('patterns')"><span class="app-nav-icon">▦</span>Patterns</button>
	<button class="app-nav-item active" data-tab="guide" onclick="appTab('guide')"><span class="app-nav-icon">☰</span>Guide</button>
</nav>

</div>
<button class="slide-arrow slide-next" onclick="navNext()" aria-label="Next screen">→</button>
</div>
</div>

<script src="shared-facilitator.js"></script>
<script>
const TOP_SLIDE_COUNT = sessions.length + 1; // session list + one agenda per session
let topCurrent = 0;

window.onTopSlide = function(idx) { topCurrent = idx; };

function show(id) {
	document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
	document.getElementById(id).classList.add('active');
	setAppNavActive('guide');
	const immersive = id === 'guide-live';
	document.querySelectorAll('.slide-arrow').forEach(a => a.style.visibility = (immersive || id === 'guide-detail') ? 'hidden' : 'visible');
	document.getElementById('slide-counter').style.visibility = (immersive || id === 'guide-detail') ? 'hidden' : 'visible';
	document.querySelector('.app-nav').style.display = immersive ? 'none' : '';
	updateTopNav();
}

function appTab(tab) {
	if (tab === 'guide') goSessionList();
	else if (tab === 'today') window.location.href = 'flow1.html';
	else if (tab === 'practice') window.location.href = 'flow1.html';
	else if (tab === 'patterns') window.location.href = 'flow2.html';
}

function navNext() {
	const active = document.querySelector('.screen.active').id;
	if (active === 'guide-live') return liveNextSection();
	if (active === 'guide-detail') return detailNext();
	if (topCurrent < TOP_SLIDE_COUNT - 1) goToTopSlide(topCurrent + 1);
}

function navPrev() {
	const active = document.querySelector('.screen.active').id;
	if (active === 'guide-live') return livePrevSection();
	if (active === 'guide-detail') return detailPrev();
	if (topCurrent > 0) goToTopSlide(topCurrent - 1);
}

function goToTopSlide(idx) {
	if (idx === 0) goSessionList();
	else openSession(idx - 1);
}

function updateTopNav() {
	const active = document.querySelector('.screen.active').id;
	const prevBtn = document.querySelector('.slide-prev');
	const nextBtn = document.querySelector('.slide-next');
	const counter = document.getElementById('slide-counter');
	if (active === 'guide-sessions' || active === 'guide-agenda') {
		counter.textContent = (topCurrent + 1) + ' / ' + TOP_SLIDE_COUNT;
		prevBtn.disabled = topCurrent === 0;
		nextBtn.disabled = topCurrent === TOP_SLIDE_COUNT - 1;
	} else {
		prevBtn.disabled = false;
		nextBtn.disabled = false;
	}
}

document.addEventListener('keydown', e => {
	if (e.key === 'ArrowRight') navNext();
	if (e.key === 'ArrowLeft') navPrev();
});

let touchStartX = null;
const liveScreen = document.getElementById('guide-live');
liveScreen.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; });
liveScreen.addEventListener('touchend', e => {
	if (touchStartX === null) return;
	const dx = e.changedTouches[0].clientX - touchStartX;
	if (Math.abs(dx) > 50) { dx < 0 ? liveNextSection() : livePrevSection(); }
	touchStartX = null;
});

initAppNav('guide');
updateTopNav();
</script>
</body>
</html>
